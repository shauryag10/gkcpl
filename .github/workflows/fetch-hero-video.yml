name: Fetch hero video

# Downloads the chosen Pexels clip (free for commercial use), encodes it
# with scripts/prepare-hero-video.sh and commits the result to the branch
# that triggered the run. Trigger it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      pexels_id:
        description: Pexels video ID
        default: "7622785"
        required: true
      start:
        description: Start offset in seconds
        default: "0"
        required: true
      duration:
        description: Duration in seconds
        default: "14"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1

      - name: Download clip
        run: |
          set -euo pipefail
          mkdir -p /tmp/clip
          curl -fL --retry 4 --retry-delay 3 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o /tmp/clip/source.mp4 \
            "https://www.pexels.com/download/video/${{ inputs.pexels_id }}/?fps=25&w=1920&h=1080"
          ls -lh /tmp/clip/source.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,codec_name -of default=nw=1 /tmp/clip/source.mp4

      - name: Encode hero video
        run: scripts/prepare-hero-video.sh /tmp/clip/source.mp4 "${{ inputs.start }}" "${{ inputs.duration }}"

